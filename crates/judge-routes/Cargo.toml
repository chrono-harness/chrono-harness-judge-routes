[package]
name = "chrono-judge-routes"
version = "0.1.3"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-judge-routes"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vstd = "=0.0.0-2026-04-20-1748"
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "=0.3.0"
sha2 = "0.11"

# Independent judge roots also compile the shared evidence consumers.
[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package.sha2]
opt-level = 3
