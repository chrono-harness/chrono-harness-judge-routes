[package]
name = "chrono-judge-routes-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde_json = "1"

serde = {version="1",features=["derive"]}
chrono-judge-routes = { path = "../judge-routes" }

[dev-dependencies]
sha2 = "0.11"
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
tempfile = "3"

[[bin]]
name = "chrono-judge-routes-test-tool"
path = "tests/support/tool.rs"
test = false
bench = false

[[bin]]
name = "chrono-harness"
path = "tests/support/runner.rs"
test = false
bench = false

[profile.dev.package.sha2]
opt-level = 3
