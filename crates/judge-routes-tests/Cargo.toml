[package]
name = "chrono-judge-routes-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde_json = "1"

serde = {version="1",features=["derive"]}
chrono-judge-routes = { path = "../judge-routes" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "chrono-judge-routes-test-tool"
path = "tests/support/tool.rs"
test = false
bench = false

[[bin]]
name = "chrono-harness"
path = "tests/support/runner.rs"
test = false
bench = false

[profile.dev.package.sha2]
opt-level = 3
