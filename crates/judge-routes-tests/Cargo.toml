[package]
name = "chrono-judge-routes-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
serde_json = "1"

[dev-dependencies]
vstd = "=0.0.0-2026-04-20-1748"
serde = {version="1",features=["derive"]}
chrono-judge-routes = { path = "../judge-routes" }
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }
chrono-judge-registration = { git = "https://github.com/chrono-harness/chrono-harness-judge-registration.git", rev = "76530cce04ad04ebda2f71a16a8a51f930c2daa8" }
tempfile = "3"

[[bin]]
name = "chrono-judge-routes-test-tool"
path = "tests/support/tool.rs"
test = false
bench = false

[profile.dev.package.sha2]
opt-level = 3
